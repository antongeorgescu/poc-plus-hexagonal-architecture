name: Deploy clean_architecture to Azure SWA

on:
  push:
    branches: [master]
    paths:
      - 'clean_architecture/**'
      - '.github/workflows/azure-swa-clean.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [master]
    paths:
      - 'clean_architecture/**'
      - '.github/workflows/azure-swa-clean.yml'

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy (clean)
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CLEAN }}
          action: "upload"
          app_location: "clean_architecture"       # App source (relative to repo root)
          api_location: ""                          # optional
          output_location: "dist/clean-architecture-loan-poc/browser"  # relative to app_location
          github_id_token: ${{ steps.idtoken.outputs.result }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request (clean)
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CLEAN }}
          action: "close"
